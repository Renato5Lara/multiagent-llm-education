<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="680" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#222222">Figura 2 — Diagrama de casos de uso (rutas reales confirmadas en frontend/src/App.tsx)</text>

  <!-- System boundary -->
  <rect x="220" y="50" width="700" height="580" rx="6" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="570" y="70" font-size="12" font-weight="bold" text-anchor="middle" fill="#222222">UPAO-MAS-EDU</text>

  <!-- Actor: Estudiante -->
  <g transform="translate(60,180)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="45" stroke="#000" stroke-width="1.5"/>
    <line x1="-18" y1="25" x2="18" y2="25" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="-15" y2="70" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="15" y2="70" stroke="#000" stroke-width="1.5"/>
    <text x="0" y="90" font-size="11" text-anchor="middle" font-weight="bold">Estudiante</text>
  </g>

  <!-- Actor: Docente -->
  <g transform="translate(60,400)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="45" stroke="#000" stroke-width="1.5"/>
    <line x1="-18" y1="25" x2="18" y2="25" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="-15" y2="70" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="15" y2="70" stroke="#000" stroke-width="1.5"/>
    <text x="0" y="90" font-size="11" text-anchor="middle" font-weight="bold">Docente</text>
  </g>

  <!-- Actor: Admin -->
  <g transform="translate(60,560)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="45" stroke="#000" stroke-width="1.5"/>
    <line x1="-18" y1="25" x2="18" y2="25" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="-15" y2="70" stroke="#000" stroke-width="1.5"/>
    <line x1="0" y1="45" x2="15" y2="70" stroke="#000" stroke-width="1.5"/>
    <text x="0" y="90" font-size="11" text-anchor="middle" font-weight="bold">Admin</text>
  </g>

  <!-- Estudiante use cases -->
  <ellipse cx="330" cy="90" rx="90" ry="24" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="330" y="94" font-size="10" text-anchor="middle">Diagnóstico inicial</text>
  <ellipse cx="330" cy="150" rx="90" ry="24" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="330" y="148" font-size="10" text-anchor="middle">Ver ruta adaptativa</text>
  <text x="330" y="160" font-size="9" text-anchor="middle" fill="#444">(LearningPath)</text>
  <ellipse cx="330" cy="210" rx="90" ry="24" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="330" y="208" font-size="10" text-anchor="middle">Orquestar módulo</text>
  <text x="330" y="220" font-size="9" text-anchor="middle" fill="#444">(ModuleLearningView)</text>
  <ellipse cx="530" cy="90" rx="90" ry="24" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="530" y="94" font-size="10" text-anchor="middle">Recibir contenido adaptativo</text>
  <ellipse cx="530" cy="150" rx="90" ry="24" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="530" y="154" font-size="10" text-anchor="middle">Evaluarse</text>
  <ellipse cx="530" cy="210" rx="90" ry="24" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="530" y="208" font-size="10" text-anchor="middle">Chat con tutor IA</text>

  <line x1="72" y1="185" x2="240" y2="90" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="185" x2="240" y2="150" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="185" x2="240" y2="210" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="185" x2="440" y2="90" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="185" x2="440" y2="150" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="185" x2="440" y2="210" stroke="#666" stroke-width="1"/>

  <!-- Docente use cases -->
  <ellipse cx="330" cy="320" rx="90" ry="24" fill="#eef4fc" stroke="#6c8ebf"/>
  <text x="330" y="318" font-size="10" text-anchor="middle">Gestionar cursos</text>
  <ellipse cx="330" cy="380" rx="90" ry="24" fill="#eef4fc" stroke="#6c8ebf"/>
  <text x="330" y="378" font-size="10" text-anchor="middle">Generar plan semanal</text>
  <text x="330" y="390" font-size="9" text-anchor="middle" fill="#444">(Research+ReviewerAgent)</text>
  <ellipse cx="330" cy="440" rx="90" ry="24" fill="#eef4fc" stroke="#6c8ebf"/>
  <text x="330" y="438" font-size="10" text-anchor="middle">Validar plan generado</text>
  <ellipse cx="530" cy="320" rx="90" ry="24" fill="#eef4fc" stroke="#6c8ebf"/>
  <text x="530" y="318" font-size="10" text-anchor="middle">Ver analítica de curso</text>
  <ellipse cx="530" cy="380" rx="90" ry="24" fill="#eef4fc" stroke="#6c8ebf"/>
  <text x="530" y="378" font-size="10" text-anchor="middle">Comparar sesiones swarm</text>
  <ellipse cx="530" cy="440" rx="90" ry="24" fill="#eef4fc" stroke="#6c8ebf"/>
  <text x="530" y="438" font-size="10" text-anchor="middle">Resolver escalada (HITL)</text>

  <line x1="72" y1="405" x2="240" y2="320" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="405" x2="240" y2="380" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="405" x2="240" y2="440" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="405" x2="440" y2="320" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="405" x2="440" y2="380" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="405" x2="440" y2="440" stroke="#666" stroke-width="1"/>

  <!-- Admin use cases -->
  <ellipse cx="330" cy="530" rx="90" ry="24" fill="#f0f0f0" stroke="#666"/>
  <text x="330" y="528" font-size="10" text-anchor="middle">Gestionar usuarios</text>
  <ellipse cx="330" cy="585" rx="90" ry="24" fill="#f0f0f0" stroke="#666"/>
  <text x="330" y="583" font-size="10" text-anchor="middle">Asignar roles</text>
  <ellipse cx="530" cy="530" rx="90" ry="24" fill="#f0f0f0" stroke="#666"/>
  <text x="530" y="528" font-size="10" text-anchor="middle">Ver estado del sistema</text>

  <line x1="72" y1="565" x2="240" y2="530" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="565" x2="240" y2="585" stroke="#666" stroke-width="1"/>
  <line x1="72" y1="565" x2="440" y2="530" stroke="#666" stroke-width="1"/>

  <!-- Modo Evidencia -->
  <ellipse cx="740" cy="380" rx="110" ry="30" fill="#fdf3d6" stroke="#c9a13b" stroke-dasharray="5 3"/>
  <text x="740" y="376" font-size="10" text-anchor="middle" font-weight="bold">Modo Evidencia</text>
  <text x="740" y="390" font-size="9" text-anchor="middle" fill="#555">(sin rol — /evidencia, /replay)</text>
  <text x="620" y="640" font-size="10" fill="#555">Nota verificada: las rutas /evidencia y /replay no llevan ProtectedRoute — accesibles sin rol asignado (App.tsx).</text>

</svg>
