<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="Helvetica, Arial, sans-serif" font-size="10.5">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1080" height="620" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold">Figura 4 — Secuencia crítica: generación de contenido de módulo</text>
  <text x="20" y="42" font-size="10" fill="#555">Flujo real trazado por auditoría de código (POST /api/students/module/{id}/orchestrate)</text>

  <!-- Lifelines -->
  <!-- 5 actors -->
  <!-- x positions -->
  <!-- Frontend 100, students.py 300, module_orchestration_service 520, ResearchAgent 740, LLMService 950 -->
  <g font-weight="bold" text-anchor="middle" font-size="10.5">
    <rect x="40" y="60" width="140" height="30" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="110" y="80">ModuleLearningView.tsx</text>

    <rect x="250" y="60" width="140" height="30" fill="#ffe6cc" stroke="#d79b00"/>
    <text x="320" y="75">students.py</text>
    <text x="320" y="87" font-weight="normal" font-size="8.5">orchestrate_module()</text>

    <rect x="460" y="60" width="150" height="30" fill="#dae8fc" stroke="#6c8ebf"/>
    <text x="535" y="75">module_orchestration</text>
    <text x="535" y="87" font-weight="normal" font-size="8.5">_service.py</text>

    <rect x="680" y="60" width="150" height="30" fill="#f5f5f5" stroke="#6c8ebf"/>
    <text x="755" y="80">ResearchAgent</text>

    <rect x="900" y="60" width="140" height="30" fill="#e1d5e7" stroke="#9673a6"/>
    <text x="970" y="80">LLMService (gpt-4o-mini)</text>
  </g>

  <!-- lifelines -->
  <line x1="110" y1="90" x2="110" y2="600" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="320" y1="90" x2="320" y2="600" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="535" y1="90" x2="535" y2="600" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="755" y1="90" x2="755" y2="600" stroke="#999" stroke-dasharray="3 3"/>
  <line x1="970" y1="90" x2="970" y2="600" stroke="#999" stroke-dasharray="3 3"/>

  <!-- messages -->
  <line x1="110" y1="120" x2="320" y2="120" stroke="#000" marker-end="url(#ar)"/>
  <text x="115" y="114" font-size="9.5">1. useModuleOrchestration() → POST /module/{id}/orchestrate</text>

  <line x1="320" y1="150" x2="320" y2="150" stroke="#000"/>
  <text x="325" y="148" font-size="9.5">2. active_mission_service.get_resumable() — ¿ya existe adaptación persistida?</text>
  <text x="325" y="160" font-size="9" fill="#555">Si existe: retorna directo, NO reorquesta (students.py:718)</text>

  <line x1="320" y1="185" x2="535" y2="185" stroke="#000" marker-end="url(#ar)"/>
  <text x="325" y="179" font-size="9.5">3. module_orchestration_service.orchestrate_module()</text>

  <line x1="535" y1="215" x2="535" y2="215" stroke="#000"/>
  <text x="540" y="213" font-size="9.5">4. Fase 1: query_narrative_persona() — continuidad narrativa</text>

  <line x1="535" y1="245" x2="755" y2="245" stroke="#000" marker-end="url(#ar)"/>
  <text x="540" y="239" font-size="9.5">5. Fase 2: ResearchAgent.analyze(state)</text>

  <line x1="755" y1="270" x2="755" y2="270" stroke="#000"/>
  <text x="760" y="268" font-size="9.5">6. Retrieval (Tavily) + validación de consistencia interna</text>
  <text x="760" y="280" font-size="9.5">   + construcción de payload de consenso</text>

  <line x1="755" y1="305" x2="535" y2="305" stroke="#000" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="620" y="299" font-size="9.5">7. retorna hallazgos de investigación</text>

  <line x1="535" y1="335" x2="970" y2="335" stroke="#000" marker-end="url(#ar)"/>
  <text x="540" y="329" font-size="9.5">8. Fase 3: _build_concept_blocks() → llamada directa a LLMService (no vía agente)</text>

  <line x1="970" y1="365" x2="535" y2="365" stroke="#000" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="700" y="359" font-size="9.5">9. ConceptBlocks generados (fallback a plantillas si no hay OpenAI)</text>

  <line x1="535" y1="395" x2="535" y2="395" stroke="#000"/>
  <text x="540" y="393" font-size="9.5">10. Fase 4: publish_narrative_persona()</text>

  <line x1="535" y1="425" x2="320" y2="425" stroke="#000" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="340" y="419" font-size="9.5">11. ModuleOrchestrationResponse validado</text>

  <line x1="320" y1="455" x2="320" y2="455" stroke="#000"/>
  <text x="325" y="453" font-size="9.5">12. active_mission_service.save_snapshot() + log_action_sync() (auditoría no bloqueante)</text>

  <line x1="320" y1="485" x2="110" y2="485" stroke="#000" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="130" y="479" font-size="9.5">13. respuesta al frontend → AdaptiveContentRenderer reordena bloques</text>

  <text x="20" y="540" font-size="9.5" fill="#555">Nota verificada: en este flujo específico NO se instancian ProgrammerAgent ni ReviewerAgent — solo ResearchAgent + llamada directa a LLMService.</text>
  <text x="20" y="555" font-size="9.5" fill="#555">Timeout de orquestación gestionado con asyncio.wait_for(); degrada a _degraded_result() si excede el límite (module_orchestration_service.py).</text>
</svg>
