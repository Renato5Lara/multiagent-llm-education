<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 830" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#000000"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d79b00"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="830" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#222222">Figura 1 — Arquitectura de UPAO-MAS-EDU (estado real del repositorio)</text>

  <!-- ===================== EDGES (drawn first, under boxes) ===================== -->
  <!-- Cliente -> FastAPI -->
  <line x1="510" y1="100" x2="510" y2="160" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="518" y="134" font-size="11" fill="#000000">HTTP/REST + SSE</text>

  <!-- FastAPI -> Runtime (integracion parcial, naranja discontinuo) -->
  <polyline points="450,230 450,255 210,255 210,280" fill="none" stroke="#d79b00" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowOrange)"/>
  <text x="215" y="250" font-size="10.5" fill="#d79b00">/api/runtime (Boundary — integración parcial)</text>

  <!-- FastAPI -> Orquestacion (produccion) -->
  <line x1="570" y1="230" x2="570" y2="280" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="578" y="260" font-size="10.5" fill="#000000">/api/students</text>
  <text x="578" y="273" font-size="10.5" fill="#000000">/api/pedagogy</text>

  <!-- Runtime -> PostgreSQL (conexion propia) -->
  <polyline points="142,600 142,620 338,620 338,650" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="150" y="617" font-size="10" fill="#000000">conexión propia (psycopg2, ADR-0009)</text>

  <!-- FastAPI -> PostgreSQL (SQLAlchemy async) -->
  <line x1="405" y1="230" x2="405" y2="648" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="410" y="440" font-size="10.5" fill="#000000">SQLAlchemy async</text>

  <!-- Orquestacion -> LLM Providers -->
  <polyline points="570,500 570,560 670,560 670,655" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="578" y="557" font-size="10.5" fill="#000000">OpenAI API</text>

  <!-- Runtime -> LLM Providers -->
  <polyline points="380,520 720,520 720,683 610,683" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="640" y="517" font-size="10.5" fill="#000000">OpenAI API</text>

  <!-- Benchmark Runner -> Legacy (experimental, punteado gris) -->
  <line x1="880" y1="220" x2="880" y2="280" stroke="#666666" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrowGrey)"/>
  <text x="886" y="255" font-size="10.5" fill="#666666">AgentFactory</text>

  <!-- ===================== NODES ===================== -->

  <!-- Cliente Web -->
  <rect x="410" y="40" width="200" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="510" y="75" font-size="13" font-weight="bold" text-anchor="middle" fill="#111111">Cliente Web (React)</text>

  <!-- FastAPI API Layer -->
  <rect x="360" y="160" width="300" height="70" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="510" y="182" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111111">FastAPI — API Layer</text>
  <text x="510" y="198" font-size="10.5" text-anchor="middle" fill="#333333">22 routers registrados</text>
  <text x="510" y="212" font-size="10.5" text-anchor="middle" fill="#333333">(auth, students, pedagogy, swarm, runtime, replay, ...)</text>

  <!-- Runtime LangGraph container -->
  <rect x="40" y="280" width="340" height="320" rx="4" fill="#eaf5ea" stroke="#82b366" stroke-width="1.5"/>
  <rect x="40" y="280" width="340" height="30" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="60" y="300" font-size="12" font-weight="bold" fill="#111111">Runtime LangGraph (RFC-0004) — vigente</text>

  <rect x="60" y="320" width="300" height="50" rx="6" fill="#f5f5f5" stroke="#82b366" stroke-width="1.2"/>
  <text x="210" y="340" font-size="11" text-anchor="middle" fill="#111111">Platform Boundary (RFC-0010)</text>
  <text x="210" y="354" font-size="10" text-anchor="middle" fill="#444444">/api/runtime · runtime_bridge.py</text>

  <rect x="60" y="390" width="300" height="50" rx="6" fill="#f5f5f5" stroke="#82b366" stroke-width="1.2"/>
  <text x="210" y="410" font-size="11" text-anchor="middle" fill="#111111">Graph Engine — StateGraph real</text>
  <text x="210" y="424" font-size="10" text-anchor="middle" fill="#444444">engine/graph/walkthrough.py</text>

  <rect x="60" y="460" width="140" height="110" rx="6" fill="#f5f5f5" stroke="#82b366" stroke-width="1.2"/>
  <text x="130" y="478" font-size="11" text-anchor="middle" fill="#111111">Domain</text>
  <text x="130" y="494" font-size="9.5" text-anchor="middle" fill="#444444">adaptar · diagnosticar</text>
  <text x="130" y="507" font-size="9.5" text-anchor="middle" fill="#444444">evaluar · modelar</text>
  <text x="130" y="520" font-size="9.5" text-anchor="middle" fill="#444444">orientar · remediar</text>
  <text x="130" y="533" font-size="9.5" text-anchor="middle" fill="#444444">tutorizar · validar</text>

  <rect x="220" y="460" width="140" height="110" rx="6" fill="#f5f5f5" stroke="#82b366" stroke-width="1.2"/>
  <text x="290" y="478" font-size="11" text-anchor="middle" fill="#111111">Kernel</text>
  <text x="290" y="497" font-size="9.5" text-anchor="middle" fill="#444444">reducers · memoria</text>
  <text x="290" y="510" font-size="9.5" text-anchor="middle" fill="#444444">consenso · eventos</text>

  <!-- Orquestacion de Servicios container -->
  <rect x="440" y="280" width="260" height="220" rx="4" fill="#eef4fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="440" y="280" width="260" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="460" y="300" font-size="11.5" font-weight="bold" fill="#111111">Orquestación de Servicios — vigente</text>

  <rect x="460" y="320" width="220" height="50" rx="6" fill="#f5f5f5" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="570" y="338" font-size="10.5" text-anchor="middle" fill="#111111">Agente de Investigación (ResearchAgent)</text>
  <text x="570" y="352" font-size="8.5" text-anchor="middle" fill="#555555">usado en: módulo (estudiante) + plan semanal (docente)</text>

  <rect x="460" y="380" width="220" height="50" rx="6" fill="#f5f5f5" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="570" y="398" font-size="10.5" text-anchor="middle" fill="#111111">Agente de Generación de Código (ProgrammerAgent)</text>
  <text x="570" y="412" font-size="8.5" text-anchor="middle" fill="#555555">solo vía ReviewerAgent (plan semanal, docente)</text>

  <rect x="460" y="440" width="220" height="50" rx="6" fill="#f5f5f5" stroke="#6c8ebf" stroke-width="1.2"/>
  <text x="570" y="458" font-size="10.5" text-anchor="middle" fill="#111111">Agente de Revisión (ReviewerAgent)</text>
  <text x="570" y="472" font-size="8.5" text-anchor="middle" fill="#555555">solo plan semanal (docente)</text>

  <!-- Benchmark Runner -->
  <rect x="770" y="160" width="220" height="60" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="880" y="185" font-size="11" text-anchor="middle" fill="#333333">Benchmark Runner</text>
  <text x="880" y="200" font-size="10" text-anchor="middle" fill="#555555">(app/experiment) — experimental</text>

  <!-- Legacy BaseAgent container -->
  <rect x="760" y="280" width="240" height="200" rx="4" fill="#f0f0f0" stroke="#666666" stroke-width="1.5"/>
  <rect x="760" y="280" width="240" height="30" fill="#e8e8e8" stroke="#666666" stroke-width="1.5"/>
  <text x="775" y="300" font-size="11.5" font-weight="bold" fill="#333333">BaseAgent — legado / cuarentena</text>
  <text x="880" y="335" font-size="10" text-anchor="middle" fill="#555555">11 subclases en cuarentena</text>
  <text x="880" y="360" font-size="10" text-anchor="middle" fill="#555555">Único consumo real:</text>
  <text x="880" y="374" font-size="10" text-anchor="middle" fill="#555555">grupo de control experimental</text>
  <text x="880" y="388" font-size="10" text-anchor="middle" fill="#555555">(benchmark Legacy vs Runtime)</text>
  <text x="880" y="412" font-size="10" text-anchor="middle" fill="#555555">Sin ruta HTTP registrada en main.py</text>

  <!-- PostgreSQL (cylinder) -->
  <path d="M 290,662 a 80,12 0 0 1 160,0 v 66 a 80,12 0 0 1 -160,0 z" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <ellipse cx="370" cy="662" rx="80" ry="12" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="370" y="700" font-size="11" text-anchor="middle" fill="#111111">PostgreSQL 16</text>
  <text x="370" y="714" font-size="9.5" text-anchor="middle" fill="#333333">32 modelos · 22 migraciones</text>

  <!-- LLM Providers -->
  <rect x="610" y="655" width="200" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="710" y="685" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111111">LLM Providers</text>
  <text x="710" y="701" font-size="10" text-anchor="middle" fill="#333333">OpenAI (fallback: templates)</text>

  <!-- Legend -->
  <rect x="40" y="650" width="230" height="150" fill="none" stroke="#666666" stroke-width="1"/>
  <text x="50" y="670" font-size="12" font-weight="bold" fill="#222222">Leyenda</text>

  <line x1="50" y1="694" x2="80" y2="694" stroke="#000000" stroke-width="2"/>
  <text x="90" y="698" font-size="10.5" fill="#222222">Producción</text>

  <line x1="50" y1="724" x2="80" y2="724" stroke="#d79b00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="90" y="728" font-size="10.5" fill="#222222">Integración parcial</text>

  <line x1="50" y1="754" x2="80" y2="754" stroke="#666666" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="90" y="758" font-size="10.5" fill="#222222">Experimental / sin producción</text>

</svg>
