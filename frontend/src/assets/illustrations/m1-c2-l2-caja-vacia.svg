<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="Outfit, 'Segoe UI', system-ui, sans-serif">
  <!-- Plantilla A (Jerarquía/Árbol) — caja vacía (ámbar punteado) arriba;
       con nombre / con valor (esmeralda sólido) abajo. §9 del design system. -->
  <rect width="800" height="1000" fill="#0a0a0f"/>

  <!-- Nodo meta: la caja vacía -->
  <rect x="170" y="88" width="460" height="188" rx="20" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="2" stroke-dasharray="9 7"/>
  <!-- Ícono contenedor abierto -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M 378 126 l 0 30 a 4 4 0 0 0 4 4 l 36 0 a 4 4 0 0 0 4 -4 l 0 -30"/>
    <line x1="372" y1="126" x2="384" y2="118"/>
    <line x1="428" y1="126" x2="416" y2="118"/>
    <line x1="378" y1="126" x2="422" y2="126"/>
  </g>
  <text x="400" y="204" fill="#f8fafc" font-size="30" font-weight="700" text-anchor="middle">CAJA VACÍA</text>
  <text x="400" y="244" fill="#94a3b8" font-size="20" text-anchor="middle">todavía no es una variable — no tiene nombre ni valor</text>

  <!-- Conectores en Y invertida -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none">
    <line x1="400" y1="276" x2="400" y2="368"/>
    <polyline points="400,368 220,368 220,448"/>
    <polyline points="400,368 580,368 580,448"/>
  </g>

  <!-- Paso 1: ahora tiene nombre -->
  <rect x="70" y="452" width="300" height="220" rx="20" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="2"/>
  <!-- Ícono etiqueta/tag (acento cian sobre el nombre) -->
  <g stroke="#06b6d4" stroke-width="2.5" fill="none">
    <path d="M 102 486 l 20 0 l 12 12 l -12 12 l -20 0 z"/>
    <circle cx="111" cy="498" r="2.5"/>
  </g>
  <text x="220" y="548" fill="#f8fafc" font-size="23" font-weight="600" text-anchor="middle">Crea una caja llamada</text>
  <text x="220" y="582" fill="#06b6d4" font-size="24" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">temperatura</text>
  <text x="220" y="632" fill="#94a3b8" font-size="19" text-anchor="middle">ahora tiene nombre</text>

  <!-- Paso 2: ahora tiene valor -->
  <rect x="430" y="452" width="300" height="220" rx="20" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="2"/>
  <!-- Ícono caja con contenido -->
  <g stroke="#10b981" stroke-width="2.5" fill="none">
    <rect x="462" y="482" width="30" height="26" rx="4"/>
    <line x1="470" y1="495" x2="484" y2="495"/>
    <line x1="477" y1="488" x2="477" y2="502"/>
  </g>
  <text x="580" y="548" fill="#f8fafc" font-size="23" font-weight="600" text-anchor="middle">Guarda el número</text>
  <text x="580" y="582" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">18</text>
  <text x="580" y="632" fill="#94a3b8" font-size="19" text-anchor="middle">ahora tiene valor</text>

  <!-- Leyenda -->
  <text x="400" y="812" fill="#94a3b8" font-size="21" text-anchor="middle">Sin el nombre, no hay dónde guardar nada.</text>
  <text x="400" y="842" fill="#94a3b8" font-size="21" text-anchor="middle">Sin el valor, no hay nada que leer.</text>
</svg>
